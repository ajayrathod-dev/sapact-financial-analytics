                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control" name="assets[WORKING CAPITAL][amount]" required readonly>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success mt-4">Submit</button>
        </form>
    </div>

    <script>
        function addSubcategory(containerId, category, side) {
            const container = document.getElementById(containerId);
            const newRow = document.createElement('div');
            newRow.className = 'row subcategory-row mb-2';
            newRow.innerHTML = `
                <div class="col-4">
                    <input type="text" class="form-control" name="${side}[${category}][subcategories][][name]" placeholder="Subcategory" required>
                </div>
                <div class="col-2">
                    <input type="number" class="form-control" name="${side}[${category}][subcategories][][no_of_accounts]" placeholder="No of A/C">
                </div>
                <div class="col-2">
                    <input type="number" class="form-control" name="${side}[${category}][subcategories][][amount]" placeholder="Amount (Rs)" oninput="updateTotal('${category}', '${side}')">
                </div>
                <div class="col-2">
                    <button type="button" class="btn btn-danger remove-btn" onclick="removeSubcategory(this, '${category}', '${side}')">Remove</button>
                </div>
            `;
            container.appendChild(newRow);
        }

        function removeSubcategory(button, category, side) {
            const row = button.parentElement.parentElement;
            row.remove();
            updateTotal(category, side);
        }

        function updateTotal(category, side) {
            const subcategories = document.querySelectorAll(`input[name="${side}[${category}][subcategories][][amount]"]`);
            let total = 0;
            let totalAccounts = 0;
            subcategories.forEach(input => {
                const value = parseFloat(input.value) || 0;
                total += value;
            });
            const noOfAccountsInputs = document.querySelectorAll(`input[name="${side}[${category}][subcategories][][no_of_accounts]"]`);
            noOfAccountsInputs.forEach(input => {
                const value = parseInt(input.value) || 0;
                totalAccounts += value;
            });
            const totalInput = document.querySelector(`input[name="${side}[${category} Total][amount]"]`);
            if (totalInput) totalInput.value = total.toFixed(2);
            const totalAccountsInput = document.querySelector(`input[name="${side}[${category} Total][no_of_accounts]"]`);
            if (totalAccountsInput) totalAccountsInput.value = totalAccounts;

            updateWorkingCapital();
        }

        function updateWorkingCapital() {
            let liabilitiesTotal = 0;
            let assetsTotal = 0;
            document.querySelectorAll('input[name$="[amount]"]').forEach(input => {
                const name = input.name;
                const value = parseFloat(input.value) || 0;
                if (name.includes('liabilities') && name.includes('Total') && !name.includes('WORKING CAPITAL')) {
                    liabilitiesTotal += value;
                } else if (name.includes('assets') && name.includes('Total') && !name.includes('WORKING CAPITAL')) {
                    assetsTotal += value;
                }
            });
            const liabilitiesWorkingCapital = document.querySelector('input[name="liabilities[WORKING CAPITAL][amount]"]');
            const assetsWorkingCapital = document.querySelector('input[name="assets[WORKING CAPITAL][amount]"]');
            if (liabilitiesWorkingCapital) liabilitiesWorkingCapital.value = liabilitiesTotal.toFixed(2);
            if (assetsWorkingCapital) assetsWorkingCapital.value = assetsTotal.toFixed(2);
        }

        document.querySelectorAll('input[name$="[amount]"]').forEach(input => {
            input.addEventListener('input', () => {
                const name = input.name;
                const categoryMatch = name.match(/\[(.*?)\]/);
                if (categoryMatch) {
                    const category = categoryMatch[1];
                    const side = name.includes('liabilities') ? 'liabilities' : 'assets';
                    if (!name.includes('Total') && !name.includes('WORKING CAPITAL')) {
                        updateTotal(category, side);
                    }
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
